<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="description" content="A small virtual pet game">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Giga Pet</title>

    <link rel="stylesheet" href="style.css">

    <!-- Load jQuery before script.js. Both scripts wait until the HTML is read. -->
    <script
      src="https://code.jquery.com/jquery-2.2.1.min.js"
      integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
      crossorigin="anonymous"
      defer>
    </script>
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1>This is your Giga Pet</h1>
    </header>

    <main>
      <section class="pet-image-container">
        <!-- This points to the image currently in your images folder. -->
        <img
          class="pet-image"
          src="images/hound.jpg"
          alt="Your virtual pet">
      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>
          Happiness:
          <strong><span class="happiness"></span> tail wags (per min)</strong>
        </div>

        <div class="button-container">
          <button class="treat-button" type="button">Treat</button>
          <button class="play-button" type="button">Play</button>
          <button class="exercise-button" type="button">Exercise</button>
          <!-- This new button connects to clickedNapButton() in script.js. -->
          <button class="nap-button" type="button">Nap</button>
        </div>

        <!-- Starts hidden. script.js fills this with a pet comment and shows it. -->
        <p class="pet-comment" aria-live="polite" style="display: none;"></p>
      </section>
    </main>
  </body>
</html>
